    <rect width="640" height="500" rx="34" fill="#FBE4D7" stroke="#F3B3A9" stroke-width="3"/>
    <text x="32" y="46" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#4A3D38">WARNING STATE</text>

